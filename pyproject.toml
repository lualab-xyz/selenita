[project]
name = "selenita"
version = "0.1.0"
description = "ACP-compatible AI coding agent built on Microsoft Agent Framework (Python)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.3",
    # Runtime-required: imported top-level by core/llm.py and acp_server (MAF core
    # plus the OpenAI provider used by the default Responses-based LlmCore).
    "agent-framework-core>=1.23",
    "agent-framework-openai>=1.17",
]

[project.scripts]
selenita = "selenita.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "coverage>=7.6",
]
# Microsoft Agent Framework pieces (agent-core task). The OpenAI provider is a separate
# package in agent-framework >= 1.23 (Responses + chat-completions clients).
agents = [
    "agent-framework-core",
    "agent-framework-openai",
    "agent-framework-ollama",
    "mcp>=2.2.0,<3",
    "tenacity>=9.1.4,<9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selenita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["selenita"]
strict = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/selenita"]
